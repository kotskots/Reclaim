name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          cat source_full/part*.txt | tr -d '\n\r ' | base64 -d > /tmp/reclaim-source.zip
          unzip -t /tmp/reclaim-source.zip
          unzip -q /tmp/reclaim-source.zip -d buildsrc
          find buildsrc -maxdepth 2 -type f | sort | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          GRADLEW=$(find buildsrc -name gradlew -type f | head -1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.5-safe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
