name: Build Android APK

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf buildsrc /tmp/reclaim-* /tmp/xzparts
          mkdir -p buildsrc /tmp/xzparts

          # Recover the source archive kept in the repository.
          head -c 8000 source_xz/part05.txt > /tmp/xzparts/p05a
          tail -c 8000 source_xz/part05.txt > /tmp/xzparts/p05b

          try_xz() {
            name="$1"; shift
            cat "$@" | tr -d '\n\r ' | base64 -d > "/tmp/$name.xz" || return 1
            xz -t "/tmp/$name.xz" || return 1
            cp "/tmp/$name.xz" /tmp/reclaim-source.xz
            return 0
          }

          COMMON=(source_xz/part00.txt source_xz/part01.txt source_xz/part02.txt source_xz/part03.txt source_xz/part04.txt)
          try_xz c1 "${COMMON[@]}" /tmp/xzparts/p05a source_xz/part06.txt || \
          try_xz c2 "${COMMON[@]}" /tmp/xzparts/p05b source_xz/part06.txt || \
          try_xz c3 "${COMMON[@]}" /tmp/xzparts/p05a || \
          try_xz c4 "${COMMON[@]}" /tmp/xzparts/p05b || \
          try_xz c5 "${COMMON[@]}" source_xz/part05.txt || {
            echo 'Could not reconstruct source archive' >&2
            exit 1
          }

          xz -dc /tmp/reclaim-source.xz > /tmp/reclaim-source.bin
          if tar -tf /tmp/reclaim-source.bin >/dev/null 2>&1; then
            tar -xf /tmp/reclaim-source.bin -C buildsrc
          elif unzip -t /tmp/reclaim-source.bin >/dev/null 2>&1; then
            unzip -q /tmp/reclaim-source.bin -d buildsrc
          else
            echo 'Decoded source is neither tar nor zip' >&2
            file /tmp/reclaim-source.bin || true
            exit 1
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle.kts -type f | head -1)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply Locked Mode v1.0.5 patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          patch -p1 --forward < "$GITHUB_WORKSPACE/patches/locked-mode-v1.0.5.patch"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.5-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
