name: Build Android APK

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Prepare verified source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf buildsrc /tmp/reclaim-source.tar.xz
          mkdir -p buildsrc
          cat source_verified/part*.txt | tr -d '\n\r ' | base64 -d > /tmp/reclaim-source.tar.xz
          echo "268860282451ad058c1a0d524b085e23a4ee2e5e754a7b8c7d21d809a6f13d90  /tmp/reclaim-source.tar.xz" | sha256sum -c -
          xz -t /tmp/reclaim-source.tar.xz
          tar -xJf /tmp/reclaim-source.tar.xz -C buildsrc

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          SETTINGS=$(find buildsrc -name settings.gradle.kts -type f | head -1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply compile fixes v2
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          patch -p1 --forward < "$GITHUB_WORKSPACE/patches/compile-fixes-v1.0.5.patch"

      - name: Fix Device Admin launcher flow
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kostas/reclaim/ProductionScreens.kt')
          s=p.read_text()
          old='''    val vpnLauncher=rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()){r->if(r.resultCode==Activity.RESULT_OK){WebsitePreferences.setEnabled(context,true);websiteEnabled=true;DnsVpnService.start(context)}}\n    val notifyLauncher=rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()){}\n'''
          new='''    val vpnLauncher=rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()){r->if(r.resultCode==Activity.RESULT_OK){WebsitePreferences.setEnabled(context,true);websiteEnabled=true;DnsVpnService.start(context)}}\n    var adminRefresh by remember{mutableIntStateOf(0)}\n    val settingsAdminLauncher=rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()){\n        LockdownPolicy.finishAdminSetup(context)\n        adminRefresh++\n    }\n    val notifyLauncher=rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()){}\n'''
          if old not in s:
              raise SystemExit('settings launcher anchor not found')
          s=s.replace(old,new,1)
          old='''            val adminActive=LockdownPolicy.isAdminActive(context); val owner=LockdownPolicy.isDeviceOwner(context)\n'''
          new='''            val adminActive=remember(adminRefresh){LockdownPolicy.isAdminActive(context)}; val owner=remember(adminRefresh){LockdownPolicy.isDeviceOwner(context)}\n'''
          if old not in s:
              raise SystemExit('admin state anchor not found')
          s=s.replace(old,new,1)
          old='''            if(!adminActive) OutlinedButton(enabled=!locked,onClick={LockdownPolicy.requestAdmin(context)},modifier=Modifier.fillMaxWidth()){Text("Enable uninstall protection")}\n'''
          new='''            if(!adminActive) OutlinedButton(enabled=!locked,onClick={\n                LockdownPolicy.beginAdminSetup(context)\n                settingsAdminLauncher.launch(LockdownPolicy.adminIntent(context))\n            },modifier=Modifier.fillMaxWidth()){Text("Enable protection")}\n'''
          if old not in s:
              raise SystemExit('admin button anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.6-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
