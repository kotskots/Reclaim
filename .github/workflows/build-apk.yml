name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf buildsrc /tmp/reclaim-* /tmp/xzparts
          mkdir -p buildsrc /tmp/xzparts

          # The source was stored as base64(XZ(...)) chunks. One earlier upload
          # accidentally combined two chunks into part05, so try the sensible
          # reconstructions and keep the first stream that passes xz integrity.
          head -c 8000 source_xz/part05.txt > /tmp/xzparts/p05a
          tail -c 8000 source_xz/part05.txt > /tmp/xzparts/p05b

          try_xz() {
            name="$1"; shift
            cat "$@" | tr -d '\n\r ' | base64 -d > "/tmp/$name.xz" || return 1
            xz -t "/tmp/$name.xz" || return 1
            cp "/tmp/$name.xz" /tmp/reclaim-source.xz
            return 0
          }

          COMMON=(source_xz/part00.txt source_xz/part01.txt source_xz/part02.txt source_xz/part03.txt source_xz/part04.txt)
          try_xz c1 "${COMMON[@]}" /tmp/xzparts/p05a source_xz/part06.txt || \
          try_xz c2 "${COMMON[@]}" /tmp/xzparts/p05b source_xz/part06.txt || \
          try_xz c3 "${COMMON[@]}" /tmp/xzparts/p05a || \
          try_xz c4 "${COMMON[@]}" /tmp/xzparts/p05b || \
          try_xz c5 "${COMMON[@]}" source_xz/part05.txt || {
            echo 'Could not reconstruct source archive' >&2
            exit 1
          }

          xz -dc /tmp/reclaim-source.xz > /tmp/reclaim-source.bin
          if tar -tf /tmp/reclaim-source.bin >/dev/null 2>&1; then
            tar -xf /tmp/reclaim-source.bin -C buildsrc
          elif unzip -t /tmp/reclaim-source.bin >/dev/null 2>&1; then
            unzip -q /tmp/reclaim-source.bin -d buildsrc
          else
            echo 'Decoded source is neither tar nor zip' >&2
            file /tmp/reclaim-source.bin || true
            exit 1
          fi
          find buildsrc -maxdepth 2 -type f | sort | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          GRADLEW=$(find buildsrc -name gradlew -type f | head -1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.5-safe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
