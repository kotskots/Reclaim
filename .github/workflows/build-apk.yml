name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source
        shell: bash
        run: |
          set -e
          rm -rf buildsrc
          mkdir buildsrc
          if [ -f Reclaim-v1.0.5-safe-source.zip ]; then
            unzip -q Reclaim-v1.0.5-safe-source.zip -d buildsrc
          elif compgen -G 'source_parts/part*.txt' > /dev/null; then
            cat source_parts/part*.txt | base64 -d > /tmp/reclaim-source.zip
            unzip -q /tmp/reclaim-source.zip -d buildsrc
          else
            echo 'No source archive found.' >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: buildsrc
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.5-safe-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
