name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          cat source_full/part*.txt | tr -d '\n\r ' | base64 -d > /tmp/reclaim-source.zip
          unzip -t /tmp/reclaim-source.zip
          unzip -q /tmp/reclaim-source.zip -d buildsrc
          find buildsrc -maxdepth 2 -type f | sort | head -100

      - name: Apply compile fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('buildsrc')
          feature = root / 'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          s = feature.read_text()
          old = 'if (showProfile) ProfileDialog(onDismiss = { showProfile = false }) { profile ->'
          new = 'if (showProfile) ProfileDialog(launchableApps, onDismiss = { showProfile = false }) { profile ->'
          assert old in s
          feature.write_text(s.replace(old, new, 1))

          main = root / 'app/src/main/java/com/kostas/reclaim/MainActivity.kt'
          s = main.read_text()
          old = 'val productivity = remember { ProductivityRepository(androidx.compose.ui.platform.LocalContext.current) }'
          new = 'val habitContext = androidx.compose.ui.platform.LocalContext.current\n    val productivity = remember(habitContext) { ProductivityRepository(habitContext) }'
          assert old in s
          main.write_text(s.replace(old, new, 1))

          prod = root / 'app/src/main/java/com/kostas/reclaim/ProductionScreens.kt'
          lines = prod.read_text().splitlines()
          # Remove the stray closing brace immediately before ProductionHealthRow.
          marker = '@Composable\nprivate fun ProductionHealthRow'
          text = '\n'.join(lines) + '\n'
          old = '}\n}\n\n@Composable\nprivate fun ProductionHealthRow'
          new = '}\n\n@Composable\nprivate fun ProductionHealthRow'
          assert old in text
          prod.write_text(text.replace(old, new, 1))
          PY

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          GRADLEW=$(find buildsrc -name gradlew -type f | head -1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.5-safe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
